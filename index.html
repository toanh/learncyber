<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f7;
    --card:#ffffff;
    --ink:#1a1d21;
    --muted:#6b7280;
    --border:#e2e5e9;
    --accent:#2563eb;
    --accent-hover:#1d4ed8;
    --error:#dc2626;
    --error-bg:#fef2f2;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1.5rem;
  }
  .card{
    width:100%;
    max-width:400px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:2.25rem 2rem;
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  }
  .brand{display:flex;align-items:center;gap:.55rem;margin-bottom:1.75rem}
  .brand .mark{
    width:32px;height:32px;border-radius:8px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),#7c3aed);
    display:grid;place-items:center;
  }
  .brand .mark svg{width:18px;height:18px}
  .brand span{font-weight:700;font-size:1.05rem;letter-spacing:-.01em}

  h1{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;margin:0 0 .35rem}
  .sub{margin:0 0 1.6rem;color:var(--muted);font-size:.92rem}

  .field{margin-bottom:1.1rem}
  .field label{display:block;font-size:.82rem;font-weight:500;margin-bottom:.4rem}
  .field input{
    width:100%;padding:.65rem .75rem;font-size:.95rem;font-family:inherit;
    color:var(--ink);background:#fff;
    border:1px solid var(--border);border-radius:9px;
    transition:border-color .12s,box-shadow .12s;
  }
  .field input:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
  }

  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;font-size:.85rem}
  .remember{display:flex;align-items:center;gap:.45rem;color:var(--muted);cursor:pointer}
  .remember input{width:15px;height:15px;accent-color:var(--accent)}
  .row a{color:var(--accent);text-decoration:none;font-weight:500}
  .row a:hover{text-decoration:underline}

  button.submit{
    width:100%;padding:.72rem;font-size:.95rem;font-weight:600;font-family:inherit;
    color:#fff;background:var(--accent);
    border:none;border-radius:9px;cursor:pointer;
    transition:background .12s;
  }
  button.submit:hover{background:var(--accent-hover)}
  button.submit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .error{
    display:none;margin:0 0 1.1rem;padding:.6rem .75rem;
    background:var(--error-bg);border:1px solid #fecaca;border-radius:9px;
    color:var(--error);font-size:.85rem;
  }
  .error.on{display:block}

  .foot{margin-top:1.6rem;text-align:center;font-size:.88rem;color:var(--muted)}
  .foot a{color:var(--accent);text-decoration:none;font-weight:500}
  .foot a:hover{text-decoration:underline}

  .success{text-align:center}
  .success .tick{
    width:52px;height:52px;margin:0 auto 1rem;border-radius:50%;
    background:#ecfdf5;display:grid;place-items:center;
  }
  .success .tick svg{width:26px;height:26px}
  .success h1{margin-bottom:.4rem}
  .success .signout{
    margin-top:1.5rem;width:100%;padding:.7rem;font-family:inherit;font-size:.92rem;font-weight:500;
    background:#fff;color:var(--ink);border:1px solid var(--border);border-radius:9px;cursor:pointer;
  }
  .success .signout:hover{background:var(--bg)}

  [hidden]{display:none !important}
</style>
</head>
<body>

  <!-- LOGIN -->
  <main class="card" id="loginCard">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </span>
      <span>Northwind</span>
    </div>

    <h1>Sign in</h1>
    <p class="sub">Enter your details to access your account.</p>

    <p class="error" id="error" role="alert">Incorrect email or password.</p>

    <form id="loginForm" method="post" action="">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="row">
        <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="submit" type="submit">Sign in</button>
    </form>

    <p class="foot">Don't have an account? <a href="#">Sign up</a></p>
  </main>

  <!-- SIGNED IN -->
  <main class="card success" id="successCard" hidden>
    <div class="tick" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
    </div>
    <h1>You're signed in</h1>
    <p class="sub" style="margin-bottom:0">Welcome back.</p>
    <button class="signout" type="button" id="signout">Sign out</button>
  </main>

<script>
(function () {
  "use strict";

  /* Demo credentials — change these two lines to whatever you like. */
  var EMAIL    = "user@example.com";
  var PASSWORD = "password";

  var form        = document.getElementById("loginForm");
  var loginCard   = document.getElementById("loginCard");
  var successCard = document.getElementById("successCard");
  var errorBox    = document.getElementById("error");

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    var email = document.getElementById("email").value;
    var pass  = document.getElementById("password").value;

    /* Fire a real POST so the credentials appear as a request payload
       in the Network tab (and, over HTTP, in plaintext on the wire). */
    var body = new URLSearchParams({ email: email, password: pass }).toString();
    try {
      fetch(window.location.pathname || "/", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body
      }).catch(function () {});   /* static host has no POST handler — response ignored */
    } catch (err) { /* no-op */ }

    /* Client-side check drives the on-screen result. */
    if (email === EMAIL && pass === PASSWORD) {
      errorBox.classList.remove("on");
      loginCard.hidden = true;
      successCard.hidden = false;
    } else {
      errorBox.classList.add("on");
      document.getElementById("password").value = "";
    }
  });

  document.getElementById("signout").addEventListener("click", function () {
    successCard.hidden = true;
    loginCard.hidden = false;
    form.reset();
  });
})();
</script>
</body>
</html>
