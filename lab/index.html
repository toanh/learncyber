<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meridian Freight · Employee Portal</title>
<script>
  /* Portal root: route to where the session belongs, before any render. */
  (function(){
    var s;
    try{ s = JSON.parse(sessionStorage.getItem("mf_session") || "null"); }catch(e){ s = null; }
    location.replace(s && s.role === "admin" ? "admin/" : s ? "profile/?id=" + s.id : "login/");
  })();
</script>
</head>
<body></body>
</html>
